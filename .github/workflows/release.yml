name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # nunca cancelar un release en curso

jobs:
  # Crea el release como draft con el changelog; los builds suben sus artefactos
  # a este draft y recién al final se publica, así nunca queda visible a medias.
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        run: |
          set -Eeuo pipefail
          echo "## What's Changed" > release_body.md
          echo "" >> release_body.md
          PREVIOUS=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -n "$PREVIOUS" ]; then
            git log "$PREVIOUS..HEAD" --no-merges --pretty=format:"- %s" >> release_body.md
          else
            git log --no-merges --pretty=format:"- %s" >> release_body.md
          fi

      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = context.ref.replace('refs/tags/', '');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Lumus Control ${tag}`,
              body: fs.readFileSync('release_body.md', 'utf8'),
              draft: true,
              // Marcar como prerelease si el tag contiene un guion (ej. v0.6.0-rc1)
              prerelease: tag.includes('-'),
            });
            return data.id;

  build:
    name: Build ${{ matrix.name }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin

          - name: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      # El secret puede traer saltos de línea accidentales; se normaliza a una
      # sola línea base64 y se expone como env para tauri-action (sin key file).
      - name: Prepare signing key
        shell: bash
        run: |
          if [ -z "$RAW_KEY" ]; then
            echo "ERROR: TAURI_SIGNING_PRIVATE_KEY secret is empty or not set"
            exit 1
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY=$(echo "$RAW_KEY" | tr -d '[:space:]')" >> "$GITHUB_ENV"
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      # tauri-action compila, firma, sube los bundles al draft y genera/mergea
      # latest.json (updater) con las URLs y firmas de cada plataforma.
      - name: Build and upload with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }}

  publish-release:
    name: Publish release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
            });

  update-tap:
    name: Update Homebrew Tap
    needs: publish-release
    runs-on: ubuntu-latest
    # Solo ejecuta en tags reales de producción (vX.Y.Z) que NO contengan guiones
    # (evita v0.0.0-rc1, v0.0.0-test, etc.). El workflow ya solo corre en tags v*.
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          path: main-repo

      # Tap centralizado: dotfn/homebrew-tap aloja los casks de todos los
      # proyectos. TAP_PAT debe tener permiso de escritura sobre ese repo.
      - name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          repository: dotfn/homebrew-tap
          token: ${{ secrets.TAP_PAT }}
          path: homebrew-tap

      - name: Read homepage URL
        id: meta
        run: |
          HOMEPAGE=$(node -pe "require('./main-repo/package.json').homepage")
          echo "homepage_url=${HOMEPAGE}" >> $GITHUB_OUTPUT

      - name: Download DMG from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.dmg" \
            --dir macos-artifact

      - name: Compute SHA256
        id: shas
        run: |
          set -Eeuo pipefail

          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          DMG_FILE=$(find macos-artifact -name "*.dmg" | head -n 1)
          if [ -z "$DMG_FILE" ] || [ ! -f "$DMG_FILE" ]; then
            echo "ERROR: No se encontró el archivo DMG en el release ${TAG}" >&2
            exit 1
          fi

          ARM_SHA=$(shasum -a 256 "$DMG_FILE" | cut -d' ' -f1)
          echo "arm_sha256=${ARM_SHA}" >> "$GITHUB_OUTPUT"
          echo "ARM64 SHA256: ${ARM_SHA}"

      - name: Update cask
        env:
          VERSION: ${{ steps.shas.outputs.version }}
          ARM_SHA: ${{ steps.shas.outputs.arm_sha256 }}
        run: |
          set -Eeuo pipefail
          cd homebrew-tap
          mkdir -p Casks

          {
            echo 'cask "lumus-control" do'
            echo "  version \"${VERSION}\""
            echo "  sha256 \"${ARM_SHA}\""
            echo ""
            echo "  url \"https://github.com/dotfn/lumus-control/releases/download/v#{version}/Lumus.Control_#{version}_aarch64.dmg\","
            echo '      verified: "github.com/dotfn/lumus-control/"'
            echo '  name "Lumus Control"'
            echo '  desc "Local control panel for WiZ smart lamps over UDP"'
            echo "  homepage \"${{ steps.meta.outputs.homepage_url }}\""
            echo ""
            echo '  depends_on macos: :big_sur'
            echo "  depends_on arch: :arm64"
            echo ""
            echo "  livecheck do"
            echo "    url :url"
            echo "    strategy :github_latest"
            echo "  end"
            echo ""
            echo '  app "Lumus Control.app"'
            echo ""
            echo "  postflight do"
            echo '    system_command "/usr/bin/xattr",'
            echo '                   args: ["-dr", "com.apple.quarantine", "#{appdir}/Lumus Control.app"]'
            echo "  end"
            echo ""
            echo "  zap trash: ["
            echo '    "~/Library/Application Support/com.lumuscontrol.desktop",'
            echo '    "~/Library/Caches/com.lumuscontrol.desktop",'
            echo '    "~/Library/Logs/com.lumuscontrol.desktop",'
            echo '    "~/Library/WebKit/com.lumuscontrol.desktop",'
            echo '    "~/Library/Saved Application State/com.lumuscontrol.desktop.savedState",'
            echo "  ]"
            echo "end"
          } > Casks/lumus-control.rb

          echo "Cask generado:"
          cat Casks/lumus-control.rb

      - name: Validate cask
        run: |
          set -Eeuo pipefail
          cd homebrew-tap
          grep -q 'version "[^"]' Casks/lumus-control.rb || { echo "ERROR: version field is empty"; exit 1; }
          grep -q 'sha256 "[^"]' Casks/lumus-control.rb || { echo "ERROR: sha256 field is empty"; exit 1; }
          ruby -c Casks/lumus-control.rb

      - name: Commit and push
        env:
          VERSION: ${{ steps.shas.outputs.version }}
        run: |
          set -Eeuo pipefail
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/lumus-control.rb
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update lumus-control to v${VERSION}"
          git push
